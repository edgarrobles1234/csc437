<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/layout.css" />

    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { RegisterFormElement } from "/src/register-form.js";

      define({
        "auth-provider": Auth.Provider,
        "register-form": RegisterFormElement
      });
    </script>
  </head>

  <body class="page-shell">
    <auth-provider>
      <main class="page-shell">
        <section class="intro-panel">
          <h2>Create Account</h2>
          <p>Register a new user to access protected edible data.</p>
        </section>

        <section class="sidebar-card">
          <register-form api="/auth/register">
            <label class="form-field">
              <span>Username</span>
              <input name="username" autocomplete="off" />
            </label>

            <label class="form-field">
              <span>Password</span>
              <input type="password" name="password" />
            </label>
          </register-form>
        </section>

        <p>
          Already have an account?
          <a href="/login.html">Sign in here</a>
        </p>
      </main>
    </auth-provider>
  </body>
</html>
